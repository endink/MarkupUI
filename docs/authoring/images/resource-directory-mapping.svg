<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">Design-time and asset directory mapping</title><desc id="desc">Pages, styles and images preserve their relative logical paths when synchronized from the design-time directory to the global asset directory.</desc><style>text{font-family:'Segoe UI',Arial,sans-serif}.title{fill:#e4edf8;font-size:24px;font-weight:600}.heading{fill:#18374b;font-size:22px;font-weight:600}.body{fill:#284b60;font-size:17px}.small{fill:#a9bfd4;font-size:15px}.code{font-family:Consolas,monospace;fill:#1e4258;font-size:17px}</style><defs><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#55b7ff" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#66d4ad" stroke-width="1.5"/></marker></defs><rect width="1120" height="560" rx="20" fill="#101a29"/><text x="40" y="49" class="title">Resource paths stay consistent after synchronization</text><text x="40" y="78" class="small">Editable source files → imported engine assets</text><rect x="40" y="110" width="430" height="375" rx="14" fill="#bcdfff"/><text x="64" y="150" class="heading">Design-time directory</text><text x="64" y="179" class="body">Source files</text><path d="M75 204V419 M75 218H97 M75 304H97 M75 390H97" fill="none" stroke="#698a9d" stroke-width="2"/><text x="108" y="222" class="code" font-weight="600">pages/</text><path d="M113 231V256H134" fill="none" stroke="#698a9d" stroke-width="2"/><text x="145" y="260" class="code">index.html</text><text x="108" y="308" class="code" font-weight="600">styles/</text><path d="M113 317V342H134" fill="none" stroke="#698a9d" stroke-width="2"/><text x="145" y="346" class="code">main.css</text><text x="108" y="394" class="code" font-weight="600">images/</text><path d="M113 403V428H134" fill="none" stroke="#698a9d" stroke-width="2"/><text x="145" y="432" class="code">a.jpg</text><rect x="650" y="110" width="430" height="375" rx="14" fill="#a8e6d0"/><text x="674" y="150" class="heading">Asset directory</text><text x="674" y="179" class="body">Logical paths of imported assets</text><path d="M685 204V419 M685 218H707 M685 304H707 M685 390H707" fill="none" stroke="#698a9d" stroke-width="2"/><text x="718" y="222" class="code" font-weight="600">pages/</text><path d="M723 231V256H744" fill="none" stroke="#698a9d" stroke-width="2"/><text x="755" y="260" class="code">index.html</text><text x="755" y="281" fill="#356956" font-size="13">Document asset</text><text x="718" y="308" class="code" font-weight="600">styles/</text><path d="M723 317V342H744" fill="none" stroke="#698a9d" stroke-width="2"/><text x="755" y="346" class="code">main.css</text><text x="755" y="367" fill="#356956" font-size="13">Style asset</text><text x="718" y="394" class="code" font-weight="600">images/</text><path d="M723 403V428H744" fill="none" stroke="#698a9d" stroke-width="2"/><text x="755" y="432" class="code">a.jpg</text><text x="755" y="453" fill="#356956" font-size="13">Image asset</text><path d="M480 255H637" fill="none" stroke="#55b7ff" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#blue)"/><path d="M480 341H637" fill="none" stroke="#55b7ff" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#blue)"/><path d="M480 427H637" fill="none" stroke="#55b7ff" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#blue)"/><text x="513" y="218" fill="#bcdfff" font-size="16">Sync</text><text x="40" y="526" class="small">Same relative paths · actual asset filenames and extensions depend on the platform plugin</text></svg>