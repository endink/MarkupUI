<title id="title">Markup UI SDK, platform plugins and applications</title>
<desc id="desc">Markup UI SDK provides shared capabilities. Unreal Engine and Unity plugins use native platform rendering; standalone apps can integrate custom rendering backends such as Skia.</desc>
