<radialGradient id="violetGlow"><stop stop-color="#a19af4" stop-opacity=".32"/><stop offset="1" stop-color="#a19af4" stop-opacity="0"/></radialGradient>
<radialGradient id="mintGlow"><stop stop-color="#57d6c0" stop-opacity=".28"/><stop offset="1" stop-color="#57d6c0" stop-opacity="0"/></radialGradient>
<linearGradient id="slotViolet" x2="1" y2="1"><stop stop-color="#a8a0f4" stop-opacity=".28"/><stop offset="1" stop-color="#a8a0f4" stop-opacity=".07"/></linearGradient>
<linearGradient id="slotMint" x2="1" y2="1"><stop stop-color="#54cbb4" stop-opacity=".28"/><stop offset="1" stop-color="#54cbb4" stop-opacity=".07"/></linearGradient>
<linearGradient id="slotGold" x2="1" y2="1"><stop stop-color="#edbc62" stop-opacity=".32"/><stop offset="1" stop-color="#edbc62" stop-opacity=".08"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#8591bb" opacity=".17"/></pattern>
