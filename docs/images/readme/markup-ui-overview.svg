</g>
</g>
<g transform="translate(60 40)" font-family="Segoe UI,Arial,sans-serif">
<path d="m54 36-13 13 13 13m33-26 13 13-13 13M74 32 63 66" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="118" y="64" class="text" font-size="38" font-weight="700">Markup UI</text>
<text x="1397" y="59" text-anchor="end" class="muted" font-size="19">HTML + CSS. Connected to your game.</text>
<rect x="42" y="99" width="530" height="235" rx="14" class="card"/>
<circle cx="64" cy="120" r="4" fill="#ef8294"/><circle cx="80" cy="120" r="4" fill="#eabb63"/><circle cx="96" cy="120" r="4" fill="#50c4a5"/>
<path d="M43 140h528" stroke="var(--line)"/><text x="121" y="125" class="muted" font-size="12">inventory.html</text>
<g font-family="Consolas,monospace" font-size="17">
<text x="65" y="166" class="blue">&lt;section <tspan class="purple">class</tspan><tspan class="green">="inventory"</tspan>&gt;</text>
<text x="87" y="199" class="blue">&lt;h2&gt;<tspan class="green">{{ PlayerName }}</tspan>&lt;/h2&gt;</text>
<text x="87" y="232" class="blue">&lt;div <tspan class="purple">@for</tspan><tspan class="green">="{Items}"</tspan>&gt;</text>
<text x="109" y="265" class="green">{{ Name }} × {{ Count }}</text>
<text x="87" y="298" class="blue">&lt;/div&gt; &lt;/section&gt;</text>
</g>
