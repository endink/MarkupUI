<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="500" viewBox="0 0 1560 500" role="img" aria-labelledby="title desc">
<title id="title">Markup UI — HTML and CSS for game interfaces</title>
<desc id="desc">HTML and CSS connect to game interfaces through data binding, with Unreal Engine and Unity support.</desc>
<style>
:root{--bg:#edf0fb;--card:#f8faff;--text:#23304b;--muted:#64718a;--line:#dce3f1;--blue:#3869cf;--purple:#8652c6;--green:#188879;--soft:#edf2ff;--pink:#c74a82}
.bg{fill:var(--bg)}.card{fill:var(--card);stroke:var(--line);filter:url(#shadow)}.text{fill:var(--text)}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.purple{fill:var(--purple)}.green{fill:var(--green)}.soft{fill:var(--soft)}
</style>
<defs>
