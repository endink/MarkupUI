<mask id="organicEdge" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="420">
<path d="M46 31C141 3 254 31 355 20S543 9 669 22 869 5 988 20 1214 3 1387 32C1421 71 1404 114 1420 163S1401 263 1414 312 1400 383 1359 399C1234 413 1145 392 1031 405S825 390 721 404 526 390 417 403 195 388 80 400C30 389 22 356 31 317S13 231 28 189 12 104 33 68Z" fill="white" filter="url(#edgeFeather)"/>
</mask>
