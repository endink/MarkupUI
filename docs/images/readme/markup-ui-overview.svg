<text x="823" y="128" class="muted" font-size="11" letter-spacing="1.6">PLAYER INVENTORY</text>
<text x="823" y="162" class="text" font-size="26" font-weight="600">Arden</text>
<rect x="977" y="150" width="199" height="6" rx="3" class="soft"/><rect x="977" y="150" width="159" height="6" rx="3" fill="#40bfaa"/>
<text x="1196" y="158" class="muted" font-size="12">HEALTH 80 / 100</text>
<rect x="823" y="181" width="170" height="90" rx="9" fill="url(#slotViolet)" stroke="#9a91e8" stroke-opacity=".45"/>
<rect x="1008" y="181" width="170" height="90" rx="9" fill="url(#slotMint)" stroke="#47bda6" stroke-opacity=".45"/>
<rect x="1193" y="181" width="181" height="90" rx="9" fill="url(#slotGold)" stroke="#d8aa54" stroke-opacity=".45"/>
<path d="M834 270h148" stroke="#9a91e8" stroke-width="2" stroke-opacity=".7"/><path d="M1019 270h148" stroke="#47bda6" stroke-width="2" stroke-opacity=".7"/><path d="M1204 270h159" stroke="#d8aa54" stroke-width="2" stroke-opacity=".7"/>
<g fill="none" stroke-width="2.5" stroke-linejoin="round"><path d="m903 194 13 13-19 19-6-6 19-19m6 6 9-9m-34 22-6 6" stroke="#9391ed"/><path d="M1084 193h15v8l7 8v19h-29v-19l7-8z" stroke="#39b9a3"/><path d="m1283 192 18 7v16l-18 14-18-14v-16z" stroke="#d6a249"/></g>
