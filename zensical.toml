  { "示例教程" = [ { "Unreal Engine" = [ { "静态信息面板" = "examples/ue/static-panel.md" } ] }, { "Unity" = [ { "静态信息面板" = "examples/unity/static-panel.md" } ] } ] },
  { "版本信息" = [ { "版本说明" = [ { "更新记录" = "releases/changelog.md" }, { "兼容性说明" = "releases/compatibility.md" } ] } ] },
]

[project.theme]
custom_dir = "overrides"
variant = "modern"
language = "zh"
logo = "images/markupui-logo.svg"
favicon = "images/markupui-logo.svg"
features = [
  "content.code.copy",
  "content.footnote.tooltips",
  "navigation.top",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.path",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions."pymdownx.details"]
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions.markupui_highlighter]
[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions."pymdownx.emoji".options]
custom_icons = ["overrides/.icons"]

[project.theme.icon]
top = "bootstrap/arrow-up"

[project.extra.navigation_icons]
"首页" = "bootstrap/house"
"Markup UI" = "bootstrap/code-slash"
"Unreal Engine" = "custom/unrealengine-inverse"
"Unity" = "simple/unity"
"示例教程" = "bootstrap/play-circle"
"版本信息" = "bootstrap/clock-history"
