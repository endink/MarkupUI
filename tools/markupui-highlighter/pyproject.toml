[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "markupui-docs-highlighter"
version = "0.6.0"
description = "Build-time syntax highlighting for Markup UI documentation"
requires-python = ">=3.11"
dependencies = [
  "Markdown>=3.7,<4", "pymdown-extensions>=12,<13",
  "tree-sitter==0.26.0", "tree-sitter-cpp==0.23.4", "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-html==0.23.2", "tree-sitter-css==0.25.0",
  "tree-sitter-javascript==0.25.0", "tree-sitter-json==0.24.8", "tree-sitter-yaml==0.7.2",
]

[tool.setuptools]
py-modules = ["markupui_highlighter", "markupui_tree_sitter", "markupui_languages"]

packages = ["markupui_queries"]

[tool.setuptools.package-data]
markupui_queries = ["manifest.json", "*/*.scm", "*/LICENSE"]
