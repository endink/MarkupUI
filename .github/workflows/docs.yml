name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            tools/markupui-highlighter/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Check syntax highlighter
        run: python -m unittest discover -s tools/markupui-highlighter -p test_highlighter.py -v
      - name: Check incremental preview highlighting
        run: python scripts/check-highlight-preview.py
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Chinese and English documentation
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          export DOCS_SITE_URL="${PAGES_URL:-http://127.0.0.1:15861}/"
          python scripts/build-docs.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
